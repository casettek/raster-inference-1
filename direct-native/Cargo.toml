[package]
name = "direct-native"
version = "0.1.0"
edition = "2021"
default-run = "direct-native"

[[bin]]
name = "direct-native"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
decode-select-token = { path = "../decode-select-token" }
det-num = { path = "../det-num" }
hex = "0.4"
input-embedding = { path = "../input-embedding" }
prefill-range = { path = "../prefill-range" }
prefill-finalize = { path = "../prefill-finalize" }
prefill-prepare-aux = { path = "../prefill-prepare-aux" }
prompt-prepare = { path = "../prompt-prepare" }
raster = { path = "../../../raster/crates/raster" }
raster-core = { path = "../../../raster/crates/raster-core" }
raster-runtime = { path = "../../../raster/crates/raster-runtime" }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
