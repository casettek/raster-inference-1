[package]
name = "raster-inference-cli"
version = "0.1.0"
edition = "2021"
default-run = "raster-inference"

[[bin]]
name = "raster-inference"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
direct-native = { path = "../direct-native" }
hex = "0.4"
model-import = { path = "../model-import" }
raster-runtime = { path = "../../../raster/crates/raster-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
